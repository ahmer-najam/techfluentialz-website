<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4E2FDA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D1680;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#purpleGradient)"/>
  
  <!-- Tech icon - stylized "T" with circuit board elements -->
  <g fill="white" opacity="0.95">
    <!-- Main T shape -->
    <rect x="60" y="60" width="136" height="28" rx="4"/>
    <rect x="108" y="88" width="40" height="100" rx="4"/>
    
    <!-- Accent dots for tech feel -->
    <circle cx="90" cy="110" r="6"/>
    <circle cx="166" cy="110" r="6"/>
    <circle cx="128" cy="155" r="6"/>
  </g>
  
  <!-- Decorative corner accent -->
  <path d="M 200 200 Q 220 180 220 200 L 220 220 Q 200 220 200 200" fill="white" opacity="0.4" stroke="white" stroke-width="2" stroke-opacity="0.6"/>
</svg>
